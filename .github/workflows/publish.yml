name: Publish Extension

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/password-ssh-proxy-tunnel
      - 'prerelease/**'
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/publish.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve publish metadata
        id: publish_meta
        run: |
          RAW_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$RAW_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-pre\.([0-9]+)$ ]]; then
            CHANNEL="pre-release"
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            PRE_N="${BASH_REMATCH[4]}"
            # Each -pre.N maps to a unique patch: base_patch + pre_n + 1
            # e.g. 0.2.40-pre.0 → 0.2.41, 0.2.40-pre.1 → 0.2.42, 0.2.40-pre.2 → 0.2.43
            PUBLISH_VERSION="${MAJOR}.${MINOR}.$((PATCH + PRE_N + 1))"
          elif [[ "$RAW_VERSION" == *-* ]]; then
            CHANNEL="pre-release"
            PUBLISH_VERSION="${RAW_VERSION%%-*}"
          else
            CHANNEL="stable"
            PUBLISH_VERSION="$RAW_VERSION"
          fi

          if [[ ! "$PUBLISH_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unsupported marketplace version '$PUBLISH_VERSION'. Expected major.minor.patch."
            exit 1
          fi

          echo "raw_version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "publish_version=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Guard release channel
        env:
          CHANNEL: ${{ steps.publish_meta.outputs.channel }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" != "master" && "$CHANNEL" != "pre-release" ]]; then
            echo "::error::Only pre-release package versions can publish from non-master branches."
            exit 1
          fi

      - name: Normalize package version for VS Marketplace
        if: steps.publish_meta.outputs.raw_version != steps.publish_meta.outputs.publish_version
        env:
          RAW_VERSION: ${{ steps.publish_meta.outputs.raw_version }}
          PUBLISH_VERSION: ${{ steps.publish_meta.outputs.publish_version }}
        run: |
          echo "::notice::Marketplace does not accept semver pre-release tags. Publishing ${RAW_VERSION} as ${PUBLISH_VERSION} with pre-release channel."
          npm pkg set version="$PUBLISH_VERSION"

      - name: Package VSIX for GitHub Release
        id: package_vsix
        env:
          CHANNEL: ${{ steps.publish_meta.outputs.channel }}
          VERSION: ${{ steps.publish_meta.outputs.publish_version }}
        run: |
          VSIX_PATH="cds-debug-${VERSION}.vsix"
          if [[ "$CHANNEL" == "pre-release" ]]; then
            npx @vscode/vsce package --pre-release --no-dependencies --out "$VSIX_PATH"
          else
            npx @vscode/vsce package --no-dependencies --out "$VSIX_PATH"
          fi
          echo "vsix_path=$VSIX_PATH" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub Release (pre-release)
        if: steps.publish_meta.outputs.channel == 'pre-release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_VERSION: ${{ steps.publish_meta.outputs.raw_version }}
          VERSION: ${{ steps.publish_meta.outputs.publish_version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::GitHub Release ${TAG} already exists."
            exit 0
          fi

          gh release create "$TAG" \
            --title "${TAG} (${RAW_VERSION})" \
            --notes "Pre-release build published from ${GITHUB_REF_NAME} at ${GITHUB_SHA}." \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false

      - name: Ensure GitHub Release (stable only)
        if: github.ref_name == 'master' && steps.publish_meta.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.publish_meta.outputs.publish_version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::GitHub Release ${TAG} already exists."
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file CHANGELOG.md \
            --latest

      - name: Upload VSIX to GitHub Release
        if: steps.publish_meta.outputs.channel == 'pre-release' || (github.ref_name == 'master' && steps.publish_meta.outputs.channel == 'stable')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.publish_meta.outputs.publish_version }}
          VSIX_PATH: ${{ steps.package_vsix.outputs.vsix_path }}
        run: |
          gh release upload "v${VERSION}" "$VSIX_PATH" --clobber

      - name: Publish stable to VS Code Marketplace
        if: github.ref_name == 'master' && steps.publish_meta.outputs.channel == 'stable'
        run: npx @vscode/vsce publish --skip-duplicate --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish pre-release to VS Code Marketplace
        if: steps.publish_meta.outputs.channel == 'pre-release'
        run: npx @vscode/vsce publish --pre-release --skip-duplicate --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
